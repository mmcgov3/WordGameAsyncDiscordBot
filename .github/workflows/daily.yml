name: Daily Discord Winners

on:
  schedule:
    - cron: "5 5 * * *"   # 05:05 UTC daily (12:05am NY in winter; ~1:05am NY in DST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: mmcgov3/WordGameBotData
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Install dependencies
        run: pip install discord.py

      - name: Run daily job
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNELS: ${{ secrets.CHANNELS }}
        run: python main.py

      - name: Commit totals files if changed
        working-directory: data
        run: |
          if git status --porcelain | grep -E -q "totals.*\.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add totals*.json
            git commit -m "Update totals"
            git push
          else
            echo "No totals changes to commit."
          fi
